<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#050608"/>
  <!-- Left Bracket in Cyan #00f0ff -->
  <path d="M23 17H16V28H11V36H16V47H23" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Bracket in Volt #38bdf8 -->
  <path d="M41 17H48V28H53V36H48V47H41" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lightning Bolt Gradient -->
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Central Lightning Bolt -->
  <path d="M37 10L24 30H33L27 54L43 26H34L37 10Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
