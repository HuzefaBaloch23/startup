<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" fill="none">
  <!-- Left Bracket in Cyan #00f0ff -->
  <path d="M42 28H28V52H18V68H28V92H42" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Bracket in Volt #38bdf8 -->
  <path d="M78 28H92V52H102V68H92V92H78" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lightning Bolt Gradient -->
  <defs>
    <linearGradient id="logoBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Central Lightning Bolt -->
  <path d="M68 14L46 54H62L52 106L82 46H64L68 14Z" fill="url(#logoBolt)" filter="url(#logoGlow)"/>
  <!-- Wordmark CODAVOLT -->
  <text x="135" y="73" fill="#f8fafc" font-family="'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.04em">CODAVOLT</text>
  <circle cx="346" cy="40" r="4.5" fill="#00f0ff"/>
</svg>
